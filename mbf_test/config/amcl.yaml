# ==============================================================================
# AMCL 调参 (mbf_demo.launch.py 的 amcl 节点加载, 2026-10-25)
#
# 目标: "局部匹配更硬 + 定错位后更快自愈":
#   - 更多粒子/光束: MID360 360° 扫描特征远多于默认 60 根光束, 提高匹配锐度,
#     让 AMCL 压得住 FAST-LIO 的缓慢漂移 (速度门 odom_guard 挡跳变, 慢漂靠这里);
#   - recovery_alpha_fast: 平均权重塌掉 (scan 与地图对不上 = 定错位) 时撒
#     随机粒子的比例, 调大 -> 更快进入全局重定位 (kidnapped-robot 自愈)。
#     显式闭环另见 scripts/reloc_guard.py (失配检测 -> 调重定位服务)。
#
# 其余未列参数用 nav2_amcl 默认值, 车上可用 ros2 param dump /amcl 看全量。
# ==============================================================================
amcl:
  ros__parameters:
    # 运动模型: 底盘是万向轮 (可全向平移)。
    # omni 模型对横向分量建噪, 是全向底盘的正确配置。
    odom_model_type: omni

    # 运动模型噪声系数: nav2_amcl 默认全部 0.2, 对 FAST-LIO (厘米级精度、
    # PTP 时钟同步) 来说太松
    # 降到 0.02: 粒子紧贴 odom 走, 有特征处 scan 匹配仍能缓慢纠偏。
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02

    # 粒子数: 100/2000 -> 400/4000, 局部定位更稳
    min_particles: 400
    max_particles: 4000

    # 参与匹配的光束数: 默认 60 -> 150 (720 个 bin 里等间隔取)
    max_beams: 150

    # 似然场最大匹配误差距离 (米): 越小匹配越严, 但地图本身有误差时太严会
    # 权重塌掉乱撒粒子。先保持默认 2.0, 定错位仍拉不回来再试 1.5
    laser_likelihood_max_dist: 2.0

    # 更新门限/重采样: 默认值, 写出来方便实车对照
    update_min_a: 0.2
    update_min_d: 0.25
    resample_interval: 1

    # 自愈强度 (默认 fast=0.1 slow=0.001): 权重塌时注入随机粒子的比例。
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.001
